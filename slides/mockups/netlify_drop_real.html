<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Netlify Drop</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI',Arial,sans-serif;
    background: radial-gradient(circle at 50% 30%, #163640 0%, #0d1f27 42%, #0a151b 100%);
    min-height:560px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 20px; color:#fff; }
  .dzwrap { position:relative; width:340px; height:340px; display:flex; align-items:center; justify-content:center; }
  .ringglow { position:absolute; border-radius:50%; border:1px solid rgba(45,212,191,.10); }
  .g1 { width:340px; height:340px; } .g2 { width:270px; height:270px; border-color:rgba(45,212,191,.16); }
  .dz { position:relative; width:208px; height:208px; }
  .dashed { position:absolute; inset:-7px; border:3px dashed #2dd4bf; border-radius:50%; }
  .circle { position:absolute; inset:0; border-radius:50%; background:#fff; color:#1f2937;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:22px; }
  .folder { margin-bottom:8px; }
  .dtext { font-size:12.5px; font-weight:600; line-height:1.4; color:#111827; }
  .links { font-size:11px; color:#6b7280; margin-top:10px; line-height:1.5; }
  .links u { text-decoration:underline; }
  h1 { font-size:44px; font-weight:800; margin-top:30px; letter-spacing:-1px; }
  .sub { color:#cdd9de; font-size:15px; margin-top:14px; line-height:1.6; text-align:center; }
</style></head><body>
  <div class="dzwrap">
    <div class="ringglow g1"></div>
    <div class="ringglow g2"></div>
    <div class="dz">
      <div class="dashed"></div>
      <div class="circle">
        <div class="folder">
          <svg width="50" height="42" viewBox="0 0 50 42" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 9a3 3 0 0 1 3-3h13l4.5 4.5H44a3 3 0 0 1 3 3V36a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z" fill="#4f7cff"/>
            <path d="M3 13h44v3H3z" fill="#3f63d6" opacity=".5"/>
          </svg>
        </div>
        <div class="dtext">Drag and drop your project folder, zip file, or a single HTML file to deploy instantly.</div>
        <div class="links">Or <u>browse files to upload</u><br>or <u>choose a folder</u></div>
      </div>
    </div>
  </div>
  <h1>Drag &amp; drop. It's online.</h1>
  <div class="sub">Drop a folder with your project's HTML, CSS, and JS files.<br>We'll give you a link to share it.</div>
</body></html>
