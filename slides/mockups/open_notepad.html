<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>메모장 열기</title>
<style>
  body { margin:0; font-family:'Malgun Gothic','Segoe UI',sans-serif; background:#1f1f2e; padding:30px;
    display:flex; flex-direction:column; align-items:center; }
  .panel { width:560px; background:#2b2b3c; border-radius:10px; box-shadow:0 18px 50px rgba(0,0,0,.5); overflow:hidden; }
  .head { padding:14px 18px; font-size:13px; color:#9a9ab0; }
  .item { display:flex; align-items:center; gap:14px; padding:14px 18px; }
  .item.sel { background:#3a3a52; border-left:4px solid #7c5cff; }
  .ic { width:42px; height:42px; border-radius:8px; background:#cfe3ff; display:flex; align-items:center; justify-content:center; font-size:22px; }
  .nm { font-size:16px; font-weight:700; color:#fff; }
  .sub { font-size:12px; color:#9a9ab0; margin-top:2px; }
  .searchbar { display:flex; align-items:center; gap:10px; margin-top:14px; background:#fff; border-radius:8px; padding:13px 16px; width:560px; }
  .searchbar input { border:none; outline:none; font-size:15px; flex:1; color:#222; }
</style></head><body>
  <div class="panel">
    <div class="head">가장 정확한 검색 결과</div>
    <div class="item sel"><div class="ic">📝</div><div><div class="nm">메모장</div><div class="sub">앱 &nbsp;·&nbsp; 열기</div></div></div>
  </div>
  <div class="searchbar"><span style="font-size:18px">🔍</span><input value="메모장" readonly></div>
</body></html>
