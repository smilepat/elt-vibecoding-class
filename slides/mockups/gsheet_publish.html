<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>구글시트 웹에 게시</title>
<style>
  body { margin:0; font-family:'Malgun Gothic','Segoe UI',sans-serif; background:#f1f3f4; padding:22px; display:flex; justify-content:center; }
  .sheet { width:860px; min-height:430px; background:#fff; border-radius:8px; box-shadow:0 16px 48px rgba(0,0,0,.25); overflow:hidden; position:relative; }
  .gbar { background:#0f9d58; height:8px; }
  .top { padding:11px 16px; border-bottom:1px solid #eee; display:flex; align-items:center; gap:10px; }
  .title { font-weight:700; color:#222; font-size:15px; } .title .ic { color:#0f9d58; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; color:#555; }
  th, td { border:1px solid #e8eaed; padding:7px 12px; text-align:left; }
  th { background:#f8f9fa; color:#777; }
  .ov { position:absolute; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; }
  .dlg { width:580px; background:#fff; border-radius:10px; box-shadow:0 20px 50px rgba(0,0,0,.4); overflow:hidden; }
  .dh { padding:16px 20px; font-size:18px; font-weight:700; color:#202124; border-bottom:1px solid #eee; }
  .db { padding:18px 20px; }
  .lbl { font-size:12px; color:#777; margin-bottom:6px; }
  .rowf { display:flex; gap:10px; margin-bottom:16px; }
  .sel { flex:1; border:2px solid #1a73e8; border-radius:6px; padding:9px 12px; font-size:13px; color:#1a73e8; font-weight:700; background:#e8f0fe; }
  .urlbox { background:#eafaf0; border:2px solid #0f9d58; border-radius:6px; padding:11px 12px; font-size:12.5px; color:#0b8043; word-break:break-all; font-weight:700; }
  .pubbtn { background:#1a73e8; color:#fff; border:none; border-radius:6px; padding:9px 20px; font-size:14px; font-weight:700; }
</style></head><body>
  <div class="sheet">
    <div class="gbar"></div>
    <div class="top"><span class="title"><span class="ic">▦</span> 단어목록 — Google Sheets</span></div>
    <table>
      <tr><th>word_id</th><th>word</th><th>뜻</th><th>CEFR</th><th>예문</th></tr>
      <tr><td>economy</td><td>economy</td><td>경제</td><td>B1</td><td>The economy is growing.</td></tr>
      <tr><td>improve</td><td>improve</td><td>향상시키다</td><td>A2</td><td>Reading improves vocabulary.</td></tr>
    </table>
    <div class="ov">
      <div class="dlg">
        <div class="dh">웹에 게시</div>
        <div class="db">
          <div class="lbl">게시할 시트 / 형식 선택</div>
          <div class="rowf">
            <div class="sel">단어 시트 ▾</div>
            <div class="sel">쉼표로 구분된 값(.csv) ▾</div>
          </div>
          <div class="lbl">게시된 CSV 주소 (이 링크를 복사)</div>
          <div class="urlbox">https://docs.google.com/spreadsheets/d/e/2PACX-1vR.../pub?output=csv</div>
          <div style="text-align:right; margin-top:16px;"><button class="pubbtn">게시</button></div>
        </div>
      </div>
    </div>
  </div>
</body></html>
