<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>index.html 열기</title>
<style>
  body { margin:0; font-family:'Malgun Gothic','Segoe UI',sans-serif; background:#dbe3f0;
    padding:30px; display:flex; justify-content:center; }
  .win { width:660px; background:#fff; border:1px solid #b9b9b9; border-radius:8px;
    box-shadow:0 20px 54px rgba(0,0,0,.35); overflow:hidden; }
  .tb { background:#f3f3f3; padding:9px 14px; font-size:13px; border-bottom:1px solid #e3e3e3;
    display:flex; justify-content:space-between; color:#333; }
  .path { background:#fafafa; padding:8px 14px; font-size:13px; color:#555; border-bottom:1px solid #eee; }
  .grid { display:flex; gap:26px; padding:26px; }
  .file { width:130px; text-align:center; padding:12px 8px; border-radius:8px; }
  .file.sel { background:#e7efff; border:1px solid #9cc0ff; }
  .ic { font-size:48px; line-height:1; }
  .chrome { display:inline-block; width:48px; height:48px; border-radius:50%; position:relative;
    background: conic-gradient(from -60deg, #ea4335 0 120deg, #fbbc05 120deg 240deg, #34a853 240deg 360deg);
    box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .chrome::before { content:""; position:absolute; inset:13px; border-radius:50%; background:#fff; }
  .chrome::after { content:""; position:absolute; inset:16px; border-radius:50%; background:#4285f4;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
  .fn { font-size:13px; margin-top:8px; color:#222; word-break:break-all; }
  .tip { margin-top:6px; font-size:12px; color:#0067c0; font-weight:700; }
</style></head><body>
  <div class="win">
    <div class="tb"><span>📁 영어앱</span><span>—&nbsp; ▢ &nbsp;✕</span></div>
    <div class="path">📍 바탕화면 › 영어앱</div>
    <div class="grid">
      <div class="file sel"><div class="ic"><span class="chrome"></span></div><div class="fn">index.html</div><div class="tip">🖱️ 더블클릭 → 크롬에서 앱 실행</div></div>
      <div class="file"><div class="ic">📄</div><div class="fn">단어목록.csv</div></div>
    </div>
  </div>
</body></html>
