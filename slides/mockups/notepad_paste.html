<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>메모장 붙여넣기·저장</title>
<style>
  body { margin:0; font-family:'Malgun Gothic','Segoe UI',sans-serif; background:#dbe3f0; padding:30px;
    display:flex; justify-content:center; }
  .np { width:640px; background:#fff; border:1px solid #b9b9b9; border-radius:8px;
    box-shadow:0 18px 50px rgba(0,0,0,.35); }
  .tb { background:#f3f3f3; padding:9px 14px; font-size:13px; border-bottom:1px solid #e3e3e3;
    display:flex; justify-content:space-between; color:#333; }
  .menu { display:flex; background:#fafafa; border-bottom:1px solid #eee; font-size:13px; position:relative; color:#222; }
  .menu span { padding:8px 14px; }
  .menu span.act { background:#e7e7ef; }
  .drop { position:absolute; top:35px; left:0; width:250px; background:#fff; border:1px solid #cfcfcf;
    box-shadow:0 10px 28px rgba(0,0,0,.25); font-size:13px; z-index:2; }
  .drop div { padding:9px 16px; display:flex; justify-content:space-between; color:#222; }
  .drop div.hl { background:#0067c0; color:#fff; font-weight:700; }
  .drop div .k { color:#999; }
  .drop div.hl .k { color:#dbe7ff; }
  .body { padding:14px 16px; font-family:Consolas,monospace; font-size:12px; color:#333; line-height:1.5; white-space:pre; height:150px; }
</style></head><body>
  <div class="np">
    <div class="tb"><span>📄 *제목 없음 - 메모장</span><span>—&nbsp; ▢ &nbsp;✕</span></div>
    <div class="menu"><span class="act">파일</span><span>편집</span><span>서식</span><span>보기</span><span>도움말</span>
      <div class="drop">
        <div>새로 만들기<span class="k">Ctrl+N</span></div>
        <div>열기<span class="k">Ctrl+O</span></div>
        <div>저장<span class="k">Ctrl+S</span></div>
        <div class="hl">다른 이름으로 저장<span class="k">Ctrl+Shift+S</span></div>
        <div>인쇄<span class="k">Ctrl+P</span></div>
      </div>
    </div>
    <div class="body">&lt;!DOCTYPE html&gt;
&lt;html lang="ko"&gt;
&lt;head&gt;&lt;meta charset="UTF-8"&gt;
  &lt;title&gt;어휘 플래시카드&lt;/title&gt;
  ... (붙여넣은 코드 전체) ...
&lt;/html&gt;</div>
  </div>
</body></html>
