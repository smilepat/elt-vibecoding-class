<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>이메일로 가입</title>
<style>
  body { margin:0; font-family:'Malgun Gothic','Segoe UI',sans-serif; background:#e9eef2; padding:24px; display:flex; justify-content:center; }
  .browser { width:840px; background:#fff; border-radius:10px; box-shadow:0 18px 50px rgba(0,0,0,.25); overflow:hidden; }
  .bar { display:flex; align-items:center; gap:12px; background:#f1f3f5; padding:10px 14px; border-bottom:1px solid #e3e6ea; }
  .dots { display:flex; gap:7px; } .dots span { width:12px; height:12px; border-radius:50%; }
  .url { flex:1; background:#fff; border:1px solid #d6dadf; border-radius:6px; padding:8px 12px; font-size:13px; color:#555; }
  .page { background:#0e1e25; padding:34px 32px 40px; }
  .logo { text-align:center; font-weight:800; font-size:20px; color:#fff; } .logo b { color:#00c7b7; }
  .form { max-width:420px; margin:22px auto 0; }
  .lab { color:#cfe0e6; font-size:13px; margin:14px 0 6px; }
  .inp { width:100%; padding:12px 14px; border-radius:8px; border:1px solid #2a3f49; background:#0a171d; color:#fff; font-size:15px; }
  .inp.hl { border:2px solid #00c7b7; }
  .submit { width:100%; margin-top:20px; padding:14px; border:none; border-radius:8px; background:#00c7b7; color:#062b27; font-size:16px; font-weight:800; }
  .login { color:#9fb3bd; font-size:13px; margin-top:16px; text-align:center; }
  .login b { color:#00c7b7; }
</style></head><body>
  <div class="browser">
    <div class="bar"><div class="dots"><span style="background:#ff5f57"></span><span style="background:#febc2e"></span><span style="background:#28c840"></span></div>
      <div class="url">🔒 app.netlify.com/signup/email</div></div>
    <div class="page">
      <div class="logo">▲ <b>Netlify</b> — 이메일로 가입</div>
      <div class="form">
        <div class="lab">이메일</div>
        <div class="inp hl">teacher@school.com</div>
        <div class="lab">비밀번호</div>
        <div class="inp hl">••••••••••</div>
        <button class="submit">가입하기 (Sign up)</button>
        <div class="login">가입 후 메일 인증 → 자동 로그인. &nbsp; 이미 계정이? <b>Log in</b></div>
      </div>
    </div>
  </div>
</body></html>
