<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>배포 완료</title>
<style>
  body { margin:0; font-family:'Malgun Gothic','Segoe UI',sans-serif; background:#e9eef2; padding:24px; display:flex; justify-content:center; }
  .browser { width:840px; background:#fff; border-radius:10px; box-shadow:0 18px 50px rgba(0,0,0,.25); overflow:hidden; }
  .bar { display:flex; align-items:center; gap:12px; background:#f1f3f5; padding:10px 14px; border-bottom:1px solid #e3e6ea; }
  .dots { display:flex; gap:7px; } .dots span { width:12px; height:12px; border-radius:50%; }
  .url { flex:1; background:#fff; border:1px solid #d6dadf; border-radius:6px; padding:8px 12px; font-size:13px; color:#555; }
  .page { padding:34px 32px; text-align:center; }
  .logo { font-weight:800; font-size:20px; color:#0e1e25; } .logo b { color:#00c7b7; }
  .ok { font-size:26px; font-weight:800; color:#0e1e25; margin-top:18px; }
  .ok .chk { color:#00a896; }
  .urlbox { margin-top:22px; display:flex; align-items:center; gap:10px; justify-content:center; }
  .pub { background:#effbfa; border:2px solid #00c7b7; border-radius:10px; padding:14px 20px; font-size:18px; font-weight:700; color:#00766c; }
  .copy { background:#00c7b7; color:#fff; border:none; border-radius:8px; padding:14px 18px; font-size:14px; font-weight:700; }
  .note { color:#789; font-size:14px; margin-top:18px; }
</style></head><body>
  <div class="browser">
    <div class="bar"><div class="dots"><span style="background:#ff5f57"></span><span style="background:#febc2e"></span><span style="background:#28c840"></span></div>
      <div class="url">🔒 app.netlify.com/drop</div></div>
    <div class="page">
      <div class="logo">▲ <b>Netlify</b> Drop</div>
      <div class="ok"><span class="chk">✅</span> 사이트가 게시되었습니다!</div>
      <div class="urlbox">
        <span class="pub">https://stellar-vocab-7f3a9.netlify.app</span>
        <button class="copy">📋 복사</button>
      </div>
      <div class="note">📱 이 주소를 휴대폰으로 열어 확인 → 동료·학생에게 공유</div>
    </div>
  </div>
</body></html>
