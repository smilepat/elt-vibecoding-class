<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>Netlify 가입</title>
<style>
  body { margin:0; font-family:'Malgun Gothic','Segoe UI',sans-serif; background:#e9eef2; padding:24px; display:flex; justify-content:center; }
  .browser { width:840px; background:#fff; border-radius:10px; box-shadow:0 18px 50px rgba(0,0,0,.25); overflow:hidden; }
  .bar { display:flex; align-items:center; gap:12px; background:#f1f3f5; padding:10px 14px; border-bottom:1px solid #e3e6ea; }
  .dots { display:flex; gap:7px; } .dots span { width:12px; height:12px; border-radius:50%; }
  .url { flex:1; background:#fff; border:1px solid #d6dadf; border-radius:6px; padding:8px 12px; font-size:13px; color:#555; }
  .page { background:#0e1e25; padding:38px 32px; text-align:center; }
  .logo { font-weight:800; font-size:22px; color:#fff; } .logo b { color:#00c7b7; }
  .title { color:#fff; font-size:24px; font-weight:700; margin-top:18px; }
  .sub { color:#9fb3bd; font-size:14px; margin-top:6px; }
  .btns { max-width:420px; margin:24px auto 0; display:flex; flex-direction:column; gap:12px; }
  .b { display:flex; align-items:center; justify-content:center; gap:10px; padding:13px; border-radius:8px; font-size:15px; font-weight:700; }
  .git { background:#24292e; color:#fff; }
  .gitlab { background:#fff; color:#222; border:1px solid #cfd6dc; }
  .email { background:#00c7b7; color:#062b27; }
  .hl { box-shadow:0 0 0 3px rgba(0,199,183,.45); }
  .login { color:#9fb3bd; font-size:13px; margin-top:18px; }
  .login b { color:#00c7b7; }
</style></head><body>
  <div class="browser">
    <div class="bar"><div class="dots"><span style="background:#ff5f57"></span><span style="background:#febc2e"></span><span style="background:#28c840"></span></div>
      <div class="url">🔒 app.netlify.com/signup</div></div>
    <div class="page">
      <div class="logo">▲ <b>Netlify</b></div>
      <div class="title">무료로 시작하기 (Sign up)</div>
      <div class="sub">신용카드 필요 없음 · 1분이면 가입 완료</div>
      <div class="btns">
        <div class="b git">🐙 GitHub로 가입</div>
        <div class="b gitlab">🦊 GitLab로 가입</div>
        <div class="b email hl">✉️ 이메일로 가입 &nbsp;← 가장 쉬움</div>
      </div>
      <div class="login">이미 계정이 있나요? <b>Log in</b></div>
    </div>
  </div>
</body></html>
